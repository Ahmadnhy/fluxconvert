<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="800" fill="#f8f9fa"/>
  
  <!-- Header/Navigation -->
  <rect width="1200" height="60" fill="#ffffff"/>
  <rect y="60" width="1200" height="1" fill="#e5e7eb"/>
  
  <!-- Logo -->
  <text x="40" y="40" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#1a1c1e">FluxConvert</text>
  
  <!-- Nav Items -->
  <text x="200" y="38" font-family="Arial, sans-serif" font-size="14" fill="#5b8ba8">Word to PDF</text>
  <text x="320" y="38" font-family="Arial, sans-serif" font-size="14" fill="#6b7280">PDF to Word</text>
  <text x="440" y="38" font-family="Arial, sans-serif" font-size="14" fill="#6b7280">JPG to PDF</text>
  
  <!-- Login/Signup -->
  <text x="1050" y="38" font-family="Arial, sans-serif" font-size="14" fill="#6b7280">Login</text>
  <rect x="1110" y="20" width="70" height="32" rx="4" fill="#5b8ba8"/>
  <text x="1130" y="42" font-family="Arial, sans-serif" font-size="14" fill="#ffffff">Sign Up</text>
  
  <!-- Title Section -->
  <text x="600" y="140" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#1a1c1e" text-anchor="middle">Word to PDF Converter</text>
  <text x="600" y="180" font-family="Arial, sans-serif" font-size="16" fill="#6b7280" text-anchor="middle">Convert your Word documents (.docx) to PDF format quickly and easily.</text>
  <text x="600" y="205" font-family="Arial, sans-serif" font-size="16" fill="#6b7280" text-anchor="middle">Maintain formatting, images, and layout.</text>
  
  <!-- Upload Box -->
  <rect x="300" y="250" width="600" height="280" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="2" stroke-dasharray="8,8"/>
  
  <!-- Upload Icon -->
  <circle cx="600" cy="350" r="40" fill="#e0f2fe"/>
  <path d="M 600 330 L 600 370 M 580 350 L 600 330 L 620 350" stroke="#5b8ba8" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M 570 370 Q 570 380 580 380 L 620 380 Q 630 380 630 370" stroke="#5b8ba8" stroke-width="3" stroke-linecap="round" fill="none"/>
  
  <!-- Upload Text -->
  <text x="600" y="420" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#1a1c1e" text-anchor="middle">Drag & Drop your Word file here</text>
  <text x="600" y="445" font-family="Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">or click to browse your device</text>
  
  <!-- Select Button -->
  <rect x="520" y="465" width="160" height="40" rx="6" fill="#5b8ba8"/>
  <text x="600" y="492" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#ffffff" text-anchor="middle">Select Word File</text>
  
  <!-- Support Text -->
  <text x="600" y="520" font-family="Arial, sans-serif" font-size="12" fill="#9ca3af" text-anchor="middle">Supports .docx files up to 50MB</text>
  
  <!-- Features Section -->
  <g transform="translate(250, 570)">
    <!-- Feature 1 -->
    <circle cx="120" cy="30" r="24" fill="#e0f2fe"/>
    <path d="M 115 30 L 118 33 L 125 26" stroke="#5b8ba8" stroke-width="2" stroke-linecap="round" fill="none"/>
    <text x="120" y="70" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#1a1c1e" text-anchor="middle">Secure & Private</text>
    <text x="120" y="90" font-family="Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Files deleted after 24h</text>
    
    <!-- Feature 2 -->
    <circle cx="350" cy="30" r="24" fill="#e0f2fe"/>
    <path d="M 345 35 L 350 25 L 355 35" stroke="#5b8ba8" stroke-width="2" stroke-linecap="round" fill="none"/>
    <text x="350" y="70" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#1a1c1e" text-anchor="middle">Fast Conversion</text>
    <text x="350" y="90" font-family="Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Convert in seconds</text>
    
    <!-- Feature 3 -->
    <circle cx="580" cy="30" r="24" fill="#e0f2fe"/>
    <circle cx="580" cy="30" r="16" stroke="#5b8ba8" stroke-width="2" fill="none"/>
    <path d="M 575 30 L 578 33 L 585 26" stroke="#5b8ba8" stroke-width="2" stroke-linecap="round" fill="none"/>
    <text x="580" y="70" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#1a1c1e" text-anchor="middle">High Quality</text>
    <text x="580" y="90" font-family="Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Maintain formatting</text>
  </g>
  
  <!-- Footer -->
  <rect y="740" width="1200" height="60" fill="#ffffff"/>
  <rect y="740" width="1200" height="1" fill="#e5e7eb"/>
  <text x="40" y="775" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#1a1c1e">FluxConvert</text>
  <text x="1100" y="775" font-family="Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end">© 2024 FluxConvert</text>
</svg>
