<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#f9f9fc"/>
  
  <!-- Gradient Background -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b617b;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#547a95;stop-opacity:0.2" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#grad1)"/>
  
  <!-- Main Content -->
  <g transform="translate(100, 150)">
    <!-- Document Icon -->
    <rect x="200" y="50" width="200" height="280" rx="12" fill="#ffffff" stroke="#547a95" stroke-width="3"/>
    <rect x="230" y="90" width="140" height="8" rx="4" fill="#e2e2e5"/>
    <rect x="230" y="120" width="140" height="8" rx="4" fill="#e2e2e5"/>
    <rect x="230" y="150" width="100" height="8" rx="4" fill="#e2e2e5"/>
    <rect x="230" y="200" width="140" height="8" rx="4" fill="#e2e2e5"/>
    <rect x="230" y="230" width="140" height="8" rx="4" fill="#e2e2e5"/>
    <rect x="230" y="260" width="80" height="8" rx="4" fill="#e2e2e5"/>
    
    <!-- Arrow -->
    <path d="M 420 190 L 480 190" stroke="#3b617b" stroke-width="4" stroke-linecap="round"/>
    <path d="M 465 175 L 480 190 L 465 205" stroke="#3b617b" stroke-width="4" stroke-linecap="round" fill="none"/>
    
    <!-- Second Document Icon -->
    <rect x="500" y="50" width="200" height="280" rx="12" fill="#ffffff" stroke="#547a95" stroke-width="3"/>
    <rect x="530" y="90" width="140" height="8" rx="4" fill="#a5cbe9"/>
    <rect x="530" y="120" width="140" height="8" rx="4" fill="#a5cbe9"/>
    <rect x="530" y="150" width="100" height="8" rx="4" fill="#a5cbe9"/>
    <rect x="530" y="200" width="140" height="8" rx="4" fill="#a5cbe9"/>
    <rect x="530" y="230" width="140" height="8" rx="4" fill="#a5cbe9"/>
    <rect x="530" y="260" width="80" height="8" rx="4" fill="#a5cbe9"/>
    
    <!-- Check Mark -->
    <circle cx="650" cy="100" r="25" fill="#3b617b"/>
    <path d="M 640 100 L 647 107 L 660 92" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>
  
  <!-- Text -->
  <text x="600" y="480" font-family="Manrope, sans-serif" font-size="48" font-weight="700" fill="#1a1c1e" text-anchor="middle">FileRefine</text>
  <text x="600" y="530" font-family="Inter, sans-serif" font-size="24" fill="#42474d" text-anchor="middle">Precise tools for creative professionals</text>
</svg>
